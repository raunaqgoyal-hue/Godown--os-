<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4f0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Godown OS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── RESET & ROOT ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f4f0; --bg1:#ffffff; --bg2:#f0ede8; --bg3:#e8e5de; --bg4:#dedad2;
  --border:#e0ddd6; --border2:#ccc9c0;
  --text:#1a1a18; --text2:#4a4a46; --text3:#888780; --text4:#c0bdb5;
  --green:#16a34a; --green-d:#dcfce7; --green-t:#14532d;
  --amber:#d97706; --amber-d:#fef9c3; --amber-t:#713f12;
  --red:#dc2626;   --red-d:#fee2e2;   --red-t:#991b1b;
  --blue:#1d4ed8;  --blue-d:#dbeafe;  --blue-t:#1e3a8a;
  --purple:#7c3aed;--purple-d:#ede9fe;--purple-t:#4c1d95;
  --accent:#1a1a18;
  --r:10px; --r-lg:14px; --r-xl:20px;
  --sh:0 2px 12px rgba(0,0,0,.08);
  --font-body:'DM Sans',sans-serif;
  --font-serif:'Instrument Serif',serif;
  --font-mono:'DM Mono',monospace;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── LOGIN SCREEN ─────────────────────────────────────────────────────────── */
#login-screen{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;background:var(--bg);
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(22,163,74,.06),transparent);
}
.login-logo{font-family:var(--font-serif);font-size:36px;color:var(--text);letter-spacing:-.02em;margin-bottom:6px;text-align:center}
.login-logo span{color:var(--green);font-style:italic}
.login-tagline{font-size:12px;color:var(--text3);text-align:center;margin-bottom:40px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.login-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;width:100%;max-width:380px;box-shadow:var(--sh)}
.login-tabs{display:flex;gap:0;background:var(--bg2);border-radius:var(--r);overflow:hidden;margin-bottom:20px;border:1px solid var(--border)}
.login-tab{flex:1;padding:9px;font-size:12px;font-weight:500;cursor:pointer;background:transparent;border:none;color:var(--text3);font-family:var(--font-body);transition:all .2s}
.login-tab.active{background:var(--bg3);color:var(--text);font-weight:600}
.field-group{margin-bottom:16px}
.field-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-family:var(--font-mono)}
.field-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--text);font-family:var(--font-body);outline:none;transition:border-color .2s}
.field-input:focus{border-color:var(--green)}
.field-input::placeholder{color:var(--text4)}
.phone-row{display:flex;gap:8px}
.country-code{width:72px;text-align:center;flex-shrink:0}
.btn-login{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:all .2s;margin-top:4px;letter-spacing:.02em}
.btn-login:hover{background:#15803d;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.otp-grid{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.otp-box{width:44px;height:52px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);font-size:20px;font-weight:700;text-align:center;color:var(--text);font-family:var(--font-mono);outline:none;transition:border-color .2s}
.otp-box:focus{border-color:var(--green)}
.login-divider{text-align:center;font-size:11px;color:var(--text3);margin:14px 0;position:relative}
.login-divider::before,.login-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.login-divider::before{left:0} .login-divider::after{right:0}
.login-msg{font-size:12px;text-align:center;margin-top:12px;padding:8px 12px;border-radius:var(--r);display:none}
.login-msg.err{background:var(--red-d);color:var(--red-t);display:block}
.login-msg.ok{background:var(--green-d);color:var(--green-t);display:block}

/* ── APP SHELL ────────────────────────────────────────────────────────────── */
#app-shell{display:none;flex-direction:column;min-height:100dvh}

/* ── TOP BAR ──────────────────────────────────────────────────────────────── */
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.topbar-logo{font-family:var(--font-serif);font-size:20px;color:var(--text);letter-spacing:-.02em;flex:1}
.topbar-logo span{color:var(--green);font-style:italic}
.topbar-role{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.role-admin{background:var(--amber-d);color:var(--amber-t);border:1px solid #fde68a}
.role-manager{background:var(--blue-d);color:var(--blue-t);border:1px solid #bfdbfe}
.role-staff{background:var(--green-d);color:var(--green-t);border:1px solid #bbf7d0}
.topbar-user{font-size:11px;color:var(--text3)}
.btn-logout{font-size:11px;padding:5px 10px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:var(--font-body)}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ── BOTTOM NAV (mobile) ─────────────────────────────────────────────────── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg1);border-top:1px solid var(--border);
  display:flex;height:62px;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:transparent;border:none;color:var(--text3);font-size:9px;font-family:var(--font-body);font-weight:500;letter-spacing:.03em;text-transform:uppercase;transition:color .15s;position:relative}
.bnav-item.active{color:var(--green)}
.bnav-item .bnav-icon{font-size:19px;line-height:1}
.bnav-badge{position:absolute;top:6px;right:calc(50% - 14px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:20px;min-width:16px;text-align:center;display:none}
.bnav-badge.show{display:block}

/* ── SIDE NAV (desktop) ──────────────────────────────────────────────────── */
.app-body{display:flex;flex:1;padding-bottom:62px}
@media(min-width:768px){
  .bottom-nav{display:none}
  .app-body{padding-bottom:0}
  .side-nav{width:220px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:54px;height:calc(100dvh - 54px);overflow-y:auto}
  .snav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);cursor:pointer;background:transparent;border:none;color:var(--text3);font-size:13px;font-family:var(--font-body);font-weight:500;width:100%;text-align:left;transition:all .15s;position:relative}
  .snav-item.active{background:var(--bg3);color:var(--text);font-weight:600}
  .snav-item:hover:not(.active){background:var(--bg2);color:var(--text2)}
  .snav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
  .snav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:16px;text-align:center;display:none}
  .snav-badge.show{display:block}
  .snav-sep{height:1px;background:var(--border);margin:6px 0}
  .snav-section{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;padding:8px 12px 4px;font-family:var(--font-mono)}
}
@media(max-width:767px){.side-nav{display:none}}

/* ── MAIN CONTENT ─────────────────────────────────────────────────────────── */
.main-content{flex:1;overflow-x:hidden;min-width:0}
.page{display:none;padding:16px;max-width:900px;margin:0 auto}
.page.active{display:block}

/* ── DASHBOARD CARDS ─────────────────────────────────────────────────────── */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:480px){.dash-grid{grid-template-columns:1fr}}
.dash-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;cursor:pointer;transition:border-color .15s}
.dash-card:hover{border-color:var(--border2)}
.dash-card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;font-family:var(--font-mono)}
.dash-card-num{font-size:30px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.03em;line-height:1}
.dash-card-sub{font-size:11px;color:var(--text3);margin-top:4px}
.dash-card-breakdown{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.dash-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}
.dash-row span:last-child{font-family:var(--font-mono);font-weight:500;color:var(--text)}
.dash-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* ── METRIC ROW ──────────────────────────────────────────────────────────── */
.metric-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:480px){.metric-row{grid-template-columns:repeat(4,1fr)}}
.metric-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px}
.metric-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-family:var(--font-mono)}
.metric-val{font-size:22px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.02em}
.metric-sub{font-size:10px;color:var(--text3);margin-top:2px}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.b{color:var(--blue)}

/* ── SECTION HEADERS ──────────────────────────────────────────────────────── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.section-sub{font-size:11px;color:var(--text3)}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;margin-bottom:12px}

/* ── ALERT ROWS ──────────────────────────────────────────────────────────── */
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r);margin-bottom:6px;border-left:3px solid}
.alert-row.urg{background:var(--red-d);border-left-color:var(--red)}
.alert-row.slw{background:var(--amber-d);border-left-color:var(--amber)}
.alert-row.vsl{background:var(--bg3);border-left-color:var(--border2)}
.alert-row.ok{background:var(--green-d);border-left-color:var(--green)}
.alert-body{flex:1;min-width:0}
.alert-spec{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--text)}
.alert-note{font-size:11px;color:var(--text3);margin-top:2px}
.alert-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:var(--font-mono)}
.ab-urg{background:var(--red-d);color:var(--red-t)}
.ab-slw{background:var(--amber-d);color:var(--amber-t)}
.ab-vsl{background:var(--bg3);color:var(--text3)}
.ab-ok{background:var(--green-d);color:var(--green-t)}

/* ── TABLES ──────────────────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--bg1)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;background:var(--bg2);font-family:var(--font-mono);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.mono{font-family:var(--font-mono);font-size:11px}

/* ── PILLS & BADGES ──────────────────────────────────────────────────────── */
.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:var(--font-mono);letter-spacing:.02em}
.pill-k{background:var(--amber-d);color:var(--amber-t)}
.pill-d{background:var(--blue-d);color:var(--blue-t)}
.pill-sm{background:var(--purple-d);color:var(--purple-t)}
.pill-n{background:var(--green-d);color:var(--green-t)}
.pill-g{background:var(--amber-d);color:var(--amber-t)}
.pill-c{background:var(--blue-d);color:var(--blue-t)}
.pill-l{background:var(--purple-d);color:var(--purple-t)}
.pill-h{background:#2a150a;color:#fdba74}

/* ── FILTERS ──────────────────────────────────────────────────────────────── */
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fsel{font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:var(--font-body);outline:none;min-width:0}
.fsel:focus{border-color:var(--green)}
.finp{font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:var(--font-body);outline:none;width:160px}
.finp:focus{border-color:var(--green)}

/* ── BUTTONS ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-weight:500;font-family:var(--font-body);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg3);border-color:var(--border2)}
.btn-g{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.btn-g:hover{background:#15803d}
.btn-wa{background:#25d366;color:#fff;border-color:#25d366;font-weight:700}
.btn-wa:hover{background:#1ebe5d}
.btn-wa-d{background:#128c7e;color:#fff;border-color:#128c7e;font-weight:700}
.btn-wa-d:hover{background:#0e7268}
.btn-red{border-color:var(--red-d);color:var(--red)}
.btn-red:hover{background:var(--red-d)}
.btn-sm{font-size:11px;padding:5px 10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ── FORM ELEMENTS ────────────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media(min-width:480px){.form-grid.cols3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:640px){.form-grid.cols5{grid-template-columns:repeat(5,1fr)}}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-mono)}
.fi{font-size:13px;padding:9px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:var(--font-body);width:100%;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--green)}
.fi::placeholder{color:var(--text4)}
.qty-inp{width:52px;font-size:13px;padding:5px 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);text-align:center;font-family:var(--font-mono);font-weight:600;outline:none}
.qty-inp:focus{border-color:var(--green)}

/* ── STOCK NUMBER ─────────────────────────────────────────────────────────── */
.snum{font-family:var(--font-mono);font-weight:700;font-size:14px}
.snum.r{color:var(--red)}.snum.a{color:var(--amber)}.snum.g{color:var(--green)}

/* ── CHECKBOX ROWS ────────────────────────────────────────────────────────── */
.check-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);margin-bottom:3px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.check-row.sel{border-color:var(--blue);background:var(--blue-d)}
.check-row:hover:not(.sel){border-color:var(--border2);background:var(--bg3)}
.check-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.check-body{flex:1;min-width:0}
.check-spec{font-family:var(--font-mono);font-size:12px;font-weight:500}
.check-note{font-size:11px;color:var(--text3);margin-top:1px}

/* ── PREVIEW BOX ──────────────────────────────────────────────────────────── */
.preview-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;line-height:1.75;max-height:220px;overflow-y:auto;margin:10px 0;color:var(--text2)}

/* ── PUSH BAR ─────────────────────────────────────────────────────────────── */
.push-bar{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:10px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.push-bar.show{display:flex}

/* ── PENDING CARD ─────────────────────────────────────────────────────────── */
.pend-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:10px}
.progress-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

/* ── ANALYTICS ────────────────────────────────────────────────────────────── */
.an-period{display:flex;gap:4px;background:var(--bg2);border-radius:var(--r);padding:3px;border:1px solid var(--border)}
.an-btn{font-size:11px;padding:5px 12px;border-radius:7px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-family:var(--font-body);font-weight:500;transition:all .15s}
.an-btn.active{background:var(--bg3);color:var(--text);font-weight:600}
.an-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.an-row:last-child{border-bottom:none}
.an-label{font-weight:600;font-size:12px;flex:1}
.an-num{font-family:var(--font-mono);font-weight:700;font-size:14px;flex-shrink:0;min-width:50px;text-align:right}
.an-bar{flex-shrink:0;width:100px}
.an-bar-fill{height:6px;background:var(--green);border-radius:3px}

/* ── ADMIN PANEL ──────────────────────────────────────────────────────────── */
.user-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--font-mono);flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600}
.user-contact{font-size:11px;color:var(--text3);font-family:var(--font-mono);margin-top:1px}

/* ── UPLOAD ZONE ──────────────────────────────────────────────────────────── */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:480px){.upload-grid{grid-template-columns:1fr}}
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--r-xl);padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--green);background:var(--green-d)}
.drop-zone input{display:none}
.dz-icon{font-size:26px;margin-bottom:6px;display:block}
.dz-text{font-size:13px;font-weight:600;margin-bottom:3px}
.dz-sub{font-size:11px;color:var(--text3)}
.upload-msg{padding:9px 12px;border-radius:var(--r);font-size:12px;margin-top:8px;font-weight:500}
.msg-ok{background:var(--green-d);color:var(--green-t);border:1px solid #1a4d2e}
.msg-err{background:var(--red-d);color:var(--red-t);border:1px solid #4d1a1a}
.msg-info{background:var(--amber-d);color:var(--amber-t);border:1px solid #4d2e0a}

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── USERS & AUTH ──────────────────────────────────────────────────────────────
const DEMO_USERS = [
  {id:'demo-admin',name:'Admin',email:'admin@godown.com',phone:'9876543210',pass:'admin123',role:'admin'},
  {id:'demo-manager',name:'Manager',email:'manager@godown.com',phone:'9876543211',pass:'mgr123',role:'manager'},
  {id:'demo-staff',name:'Staff',email:'staff@godown.com',phone:'9876543212',pass:'staff123',role:'staff'},
];

// ROLE PERMISSIONS
const PERMS = {
  admin:   {dashboard:1,alerts:1,small:1,order:1,pending:1,stock:1,upload:1,analytics:1,admin:1,search:1,hold:1},
  manager: {dashboard:1,alerts:1,small:1,order:1,pending:1,stock:1,upload:1,analytics:1,admin:0,search:1,hold:1},
  staff:   {dashboard:1,alerts:1,small:1,order:1,pending:0,stock:1,upload:1,analytics:1,admin:0,search:1,hold:0},
};

const NAV_ITEMS = [
  {id:'dashboard',icon:'🏠',label:'Home'},
  {id:'alerts',   icon:'🔔',label:'Alerts'},
  {id:'small',    icon:'📏',label:'Small Reels'},
  {id:'order',    icon:'📝',label:'Order'},
  {id:'pending',  icon:'⏳',label:'Pending'},
  {id:'stock',    icon:'📦',label:'Stock'},
  {id:'upload',   icon:'⬆️',label:'Upload PDF'},
  {id:'search',   icon:'🔍',label:'Search Stock'},
  {id:'hold',     icon:'🔒',label:'Hold Stock'},
  {id:'analytics',icon:'📊',label:'Analytics'},
  {id:'admin',    icon:'⚙️',label:'Admin',adminOnly:true},
];

// BOTTOM NAV — 5 items on mobile
const MOBILE_NAV = ['dashboard','alerts','order','upload','search'];

let currentUser = null;
let currentPage = 'dashboard';
let simOTP = '';

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function switchLoginTab(tab){
  document.querySelectorAll('.login-tab').forEach((b,i)=>b.classList.toggle('active',['phone','email'][i]===tab));
  document.getElementById('login-phone').style.display=tab==='phone'?'block':'none';
  document.getElementById('login-email').style.display=tab==='email'?'block':'none';
  document.getElementById('login-msg').className='login-msg';
}

function showLoginMsg(msg, type='err'){
  const el=document.getElementById('login-msg');
  el.textContent=msg; el.className='login-msg '+type;
}

function sendOTP(){
  const phone=document.getElementById('phone-num').value.trim();
  if(phone.length<10){showLoginMsg('Enter a valid 10-digit phone number');return;}
  const user=DEMO_USERS.find(u=>u.phone===phone);
  if(!user){showLoginMsg('Phone number not registered. Use demo accounts below.');return;}
  simOTP=Math.floor(100000+Math.random()*900000).toString();
  document.getElementById('otp-phone-display').textContent='+91 '+phone;
  document.getElementById('phone-step1').style.display='none';
  document.getElementById('phone-step2').style.display='block';
  document.getElementById('otp0').focus();
  showLoginMsg(`Demo OTP: ${simOTP} (in real app, sent via SMS)`, 'ok');
  console.log('OTP:', simOTP);
}

function resendOTP(){
  simOTP=Math.floor(100000+Math.random()*900000).toString();
  showLoginMsg(`New OTP: ${simOTP}`, 'ok');
  console.log('New OTP:', simOTP);
}

function otpInput(idx){
  const val=document.getElementById('otp'+idx).value;
  if(val&&idx<5) document.getElementById('otp'+(idx+1)).focus();
  if(idx===5&&val) verifyOTP();
}
function otpKey(e,idx){
  if(e.key==='Backspace'&&!document.getElementById('otp'+idx).value&&idx>0)
    document.getElementById('otp'+(idx-1)).focus();
}

function verifyOTP(){
  const entered=[0,1,2,3,4,5].map(i=>document.getElementById('otp'+i).value).join('');
  if(entered.length<6){showLoginMsg('Enter all 6 digits');return;}
  if(entered!==simOTP){showLoginMsg('Incorrect OTP. Try again.');return;}
  const phone=document.getElementById('phone-num').value.trim();
  const user=DEMO_USERS.find(u=>u.phone===phone);
  if(user) loginSuccess(user);
}

async function emailLogin(){
  const email=document.getElementById('email-inp').value.trim().toLowerCase();
  const pass=document.getElementById('pass-inp').value;
  if(!email||!pass){showLoginMsg('Enter email and password');return;}

  showLoginMsg('Signing in...','ok');

  // Wait for Firebase to be ready (max 5 seconds)
  let waited=0;
  while(!window.fbAuth && waited<50){
    await new Promise(r=>setTimeout(r,100));
    waited++;
  }

  // Try Firebase Auth
  if(window.fbAuth){
    try{
      const cred=await window.fbAuth.signInWithEmailAndPassword(email,pass);
      try{
        const snap=await window.fbDb.collection('users').doc(cred.user.uid).get();
        if(snap.exists){
          const ud=snap.data();
          loginSuccess({id:cred.user.uid,name:ud.name||email.split('@')[0],email,role:ud.role||'staff'});
        } else {
          loginSuccess({id:cred.user.uid,name:email.split('@')[0],email,role:'admin'});
        }
      }catch(fe){
        loginSuccess({id:cred.user.uid,name:email.split('@')[0],email,role:'admin'});
      }
      return;
    }catch(e){
      console.log('Firebase auth error:',e.code,e.message);
      // On ANY error — try demo accounts first
      const user=DEMO_USERS.find(u=>u.email===email&&u.pass===pass);
      if(user){loginSuccess(user);return;}
      // Show specific error
      if(e.code==='auth/network-request-failed'){
        showLoginMsg('Firebase unreachable. Use demo account: admin@godown.com / admin123');
      } else if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){
        showLoginMsg('Invalid email or password.');
      } else {
        showLoginMsg('Login failed: '+e.code);
      }
      return;
    }
  }

  // Firebase not available — try demo accounts
  const user=DEMO_USERS.find(u=>u.email===email&&u.pass===pass);
  if(!user){showLoginMsg('Invalid email or password.');return;}
  loginSuccess(user);
}

function loginSuccess(user){
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  document.getElementById('role-badge').textContent=user.role.toUpperCase();
  document.getElementById('role-badge').className='topbar-role role-'+user.role;
  document.getElementById('user-display').textContent=user.name;
  buildNav();
  navigateTo('dashboard');
  updatePendingCount();
  // Sync from Firestore then set up real-time listener
  syncFromFirestore().then(()=>{
    setupRealtimeSync();
    renderDashboard();
    updatePendingCount();
  });
  toast('Welcome back, '+user.name+'! 👋');
}

function logout(){
  currentUser=null;
  document.getElementById('app-shell').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('phone-step1').style.display='block';
  document.getElementById('phone-step2').style.display='none';
  document.getElementById('phone-num').value='';
  document.getElementById('email-inp').value='';
  document.getElementById('pass-inp').value='';
  document.getElementById('login-msg').className='login-msg';
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function buildNav(){
  if(!currentUser) return;
  const perms=PERMS[currentUser.role]||{};

  // ── Side nav (desktop) ──────────────────────────────────────────────────────
  const sn=document.getElementById('side-nav');
  sn.innerHTML='';
  NAV_ITEMS.forEach(item=>{
    if(!perms[item.id]) return;
    const btn=document.createElement('button');
    btn.className='snav-item'; btn.id='snav-'+item.id;
    // Highlight Upload specially
    const uploadStyle=item.id==='upload'?'background:var(--green-d);color:var(--green-t);font-weight:600;':''
    btn.innerHTML=`<span class="snav-icon">${item.icon}</span><span>${item.label}</span>${item.id==='pending'?'<span class="snav-badge" id="snav-pend-badge"></span>':''}`;
    if(item.id==='upload') btn.style.cssText='background:var(--green-d);color:var(--green-t);border:1px solid #bbf7d0;margin:4px 0';
    btn.onclick=()=>navigateTo(item.id);
    sn.appendChild(btn);
    if(item.id==='order'||item.id==='stock'){
      const sep=document.createElement('div'); sep.className='snav-sep'; sn.appendChild(sep);
    }
  });

  // ── Bottom nav (mobile) ─────────────────────────────────────────────────────
  const bn=document.getElementById('bottom-nav');
  bn.innerHTML='';
  const mobileItems=MOBILE_NAV.filter(id=>perms[id]);

  mobileItems.forEach(id=>{
    const item=NAV_ITEMS.find(n=>n.id===id);
    if(!item) return;
    const btn=document.createElement('button');
    btn.className='bnav-item'; btn.id='bnav-'+id;
    // Upload gets special green highlight
    if(id==='upload'){
      btn.style.cssText='color:var(--green);';
    }
    btn.innerHTML=`<span class="bnav-badge" id="bnav-badge-${id}"></span><span class="bnav-icon">${item.icon}</span><span>${item.label}</span>`;
    btn.onclick=()=>navigateTo(id);
    bn.appendChild(btn);
  });

  // Add "More" button for tabs not in bottom nav
  const hiddenItems=NAV_ITEMS.filter(item=>perms[item.id]&&!MOBILE_NAV.includes(item.id));
  if(hiddenItems.length){
    const moreBtn=document.createElement('button');
    moreBtn.className='bnav-item';
    moreBtn.id='bnav-more';
    moreBtn.innerHTML=`<span class="bnav-icon">···</span><span>More</span>`;
    moreBtn.onclick=()=>showMoreMenu(hiddenItems);
    bn.appendChild(moreBtn);
  }
}

function navigateTo(page){
  if(!currentUser) return;
  const perms=PERMS[currentUser.role]||{};
  if(!perms[page]) return toast('You do not have access to this section.');
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.snav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('snav-'+page)?.classList.add('active');
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('bnav-'+page)?.classList.add('active');
  renderPage(page);
  window.scrollTo(0,0);
}

// ── TOAST & MODAL ─────────────────────────────────────────────────────────────
function toast(msg, duration=3000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}
function openModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(e){
  if(e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('show');
}

// ── STORAGE — Firebase Firestore (shared across all devices) ──────────────────
// All data is stored in Firestore → syncs instantly across all phones & computers
// localStorage used as offline cache only

const SK='godown_stock_v3', HK='godown_hist_v3', PK='godown_pending_v1',
      AK='godown_analytics_v1', IAK='godown_in_analytics_v1';

// Firestore document paths — all users share the same godown data
const FS_PATHS = {
  [SK]:  'godown/stock',
  [HK]:  'godown/history',
  [PK]:  'godown/pending',
  [AK]:  'godown/analytics_out',
  [IAK]: 'godown/analytics_in',
  'godown_holds_v1': 'godown/holds',
};

// ── Read from Firestore (with localStorage fallback) ──────────────────────────
async function fsGet(key){
  try{
    if(window.fbDb){
      const path=FS_PATHS[key];if(path){
        const [col,docId]=path.split('/');
        const snap=await window.fbDb.collection(col).doc(docId).get();
        if(snap.exists){const data=snap.data().value;
          try{localStorage.setItem(key,typeof data==='string'?data:JSON.stringify(data));}catch(e){}
          return typeof data==='string'?JSON.parse(data):data;}
      }
    }
  }catch(e){console.warn('Firestore read failed:',e.message);}
  try{return JSON.parse(localStorage.getItem(key)||'null');}catch(e){return null;}
}

async function fsSave(key,value){
  const str=JSON.stringify(value);
  try{localStorage.setItem(key,str);}catch(e){}
  try{
    if(window.fbDb){
      const path=FS_PATHS[key];if(path){
        const [col,docId]=path.split('/');
        const ts = window.firebase?.firestore?.FieldValue?.serverTimestamp?.() || null;
        await window.fbDb.collection(col).doc(docId).set(
          {value:str, updatedAt:ts, updatedBy:currentUser?.name||'unknown'},
          {merge:true}
        );
      }
    }
  }catch(e){console.warn('Firestore write failed:',e.message);}
}

async function syncFromFirestore(){
  if(!window.fbDb)return;
  showSyncBanner('Syncing data...');
  try{
    await Promise.all(Object.entries(FS_PATHS).map(async([key,path])=>{
      const [col,docId]=path.split('/');
      const snap=await window.fbDb.collection(col).doc(docId).get();
      if(snap.exists){const data=snap.data().value;
        try{localStorage.setItem(key,typeof data==='string'?data:JSON.stringify(data));}catch(e){}}
    }));
    invalidateStockCache();hideSyncBanner();
    console.log('✅ Synced from Firestore');
  }catch(e){hideSyncBanner();console.warn('Sync failed:',e.message);}
}

function shdPill(s){
  const m={Natural:'pill-n',Golden:'pill-g','Corru Pack':'pill-c','LWC GB':'pill-l','HWC GB':'pill-h'};
  return`<span class="pill ${m[s]||'pill-n'}">${s}</span>`;
}
function typePill(t){return t==='kraft'?'<span class="pill pill-k">Kraft</span>':'<span class="pill pill-d">Duplex</span>'}
function segPill(s){return s==='small'?'<span class="pill pill-sm">Small</span>':s==='duplex'?'<span class="pill pill-d">Duplex</span>':'<span class="pill pill-k">Kraft</span>'}

function mkId(type,gsm,bf,size,shade){return`${type}|${gsm}|${bf||'D'}|${size}|${shade.replace(/\s+/g,'_')}`}
function normShade(s){
  if(!s)return'Natural';const u=s.trim().toUpperCase();
  if(u.includes('NATURAL'))return'Natural';if(u.includes('GOLDEN'))return'Golden';
  if(u.includes('CORRU'))return'Corru Pack';if(u.includes('LWC'))return'LWC GB';
  if(u.includes('HWC'))return'HWC GB';return s.trim().length<20?s.trim():'Natural';
}
function calcTier(stock,avgPm){
  if(stock===0)return'URGENT';
  if(avgPm>=3){return stock<4?'URGENT':'OK';}
  if(avgPm>=1){return stock<2?'URGENT':stock<=4?'SLOW':'OK';}
  return stock<2?'URGENT':stock<=4?'VERY_SLOW':'OK';
}

// ── LIVE STOCK HELPER ─────────────────────────────────────────────────────────
// Returns the real current stock for a spec:
// If a PDF has been uploaded for this spec → use (in_total - out_total)
// Otherwise → use the hardcoded baseline stock value from KRAFT/DUPLEX arrays
// This ensures the dashboard, alerts and all tabs show live numbers after upload.
let _stockCache = null;
let _stockCacheTs = 0;

function getLiveStockDb(){
  // Cache for 500ms to avoid re-parsing localStorage on every item
  const now = Date.now();
  if(_stockCache && now - _stockCacheTs < 500) return _stockCache;
  _stockCache = lsStock();
  _stockCacheTs = now;
  return _stockCache;
}

function getLiveStock(bf, gsm, size, baselineStock){
  const db = getLiveStockDb();
  const key = `${bf||''}/${gsm}/${size}`;
  if(db[key]){
    return Math.max(0, (db[key].in_total||0) - (db[key].out_total||0));
  }
  return baselineStock||0;
}

function invalidateStockCache(){ _stockCache = null; }

  const vsl=items.filter(d=>d.tier==='VERY_SLOW');
  if(!items.length) return '';

  let h=`<div style="margin-bottom:16px">

function alertCheckRow(d){
  const akey=`${d.type}|${d.gsm}|${d.bf||'D'}|${d.size}|${d.shade.replace(/\s+/g,'_')}`;
  const isSel=!!alertSel[akey];

  return `<div class="check-row${isSel?' sel':''}" onclick="toggleAlertSel('${akey}',${d.gsm},'${d.bf||null}',${d.size},'${d.shade.replace(/'/g,"\\'")}',${d.stock},${d.avg_pm||0},'${d.tier}')">

      ${tierBadge}

        onclick="event.stopPropagation()" onchange="updAlertQty('${akey}',this.value)">
    </div>
  </div>`;
}

function getAllAlerts(){
  const items=[];
  KRAFT_GSMS.forEach(gsm=>{ALL_BFS.forEach(bf=>{
    ((KRAFT[gsm]&&KRAFT[gsm][bf])||[]).forEach(item=>{
      const _ls=getLiveStock(bf,gsm,item.size,item.stock||0),tier=calcTier(_ls,item.avg_pm||0);
      if(tier==='OK')return;
      items.push({type:'kraft',gsm,bf:String(bf),size:item.size,shade:item.shade,stock:_ls,avg_pm:item.avg_pm||0,tier});
    });
  });});
  DUPLEX_GSMS.forEach(gsm=>{(DUPLEX[gsm]||[]).forEach(item=>{
    const _ls=getLiveStock(null,gsm,item.size,item.stock||0),tier=calcTier(_ls,item.avg_pm||0);
    if(tier==='OK')return;
    items.push({type:'duplex',gsm,bf:null,size:item.size,shade:item.shade,stock:_ls,avg_pm:item.avg_pm||0,tier});
  });});
  return items;
}

function toggleAlertSel(akey,gsm,bf,size,shade,stock,avgPm,tier){
  if(alertSel[akey]){delete alertSel[akey];}
  else{const k=tier==='URGENT'?4:2;alertSel[akey]={gsm,bf:bf==='null'?null:bf,size,shade,stock,avgPm,tier,qty:Math.max(1,k-stock),type:bf&&bf!=='null'?'kraft':'duplex'};}
  renderAlerts();
}
function updAlertQty(akey,val){if(alertSel[akey])alertSel[akey].qty=Math.max(1,parseInt(val)||1);}
function selectAllAlertType(type){

    const akey=`${d.type}|${d.gsm}|${d.bf||'D'}|${d.size}|${d.shade.replace(/\s+/g,'_')}`;
    if(!alertSel[akey]){const k=d.tier==='URGENT'?4:2;alertSel[akey]={...d,qty:Math.max(1,k-d.stock)};}
  });
  renderAlerts();
}

function getAllSmall(){

    ((KRAFT[gsm]&&KRAFT[gsm][bf])||[]).filter(item=>SMALL_SIZES.includes(item.size)).forEach(item=>{
      const _ls2=getLiveStock(bf,gsm,item.size,item.stock||0),tier=calcTier(_ls2,item.avg_pm||0);
      items.push({type:'kraft',gsm,bf:String(bf),size:item.size,shade:item.shade,stock:_ls2,avg_pm:item.avg_pm||0,tier});
    });

function renderSmallBody(items){
  if(!items.length)return'<div class="empty"><span class="empty-icon">📏</span>No small reels match filter.</div>';

        const k=d.tier==='URGENT'?4:2;const need=Math.max(0,k-d.stock);const qty=smallSel[akey]?.qty||Math.max(need,1);
        const tierBadge=d.tier==='URGENT'?`<span class="alert-badge ab-urg">🔴</span>`:d.tier==='SLOW'?`<span class="alert-badge ab-slw">🟡</span>`:`<span class="alert-badge ab-vsl">🟢</span>`;

function toggleSmallSel(akey,gsm,bf,size,shade,stock,avgPm,tier){
  if(smallSel[akey]){delete smallSel[akey];}
  else{const k=tier==='URGENT'?4:2;smallSel[akey]={gsm,bf,size,shade,stock,avgPm,tier,qty:Math.max(1,k-stock),type:'kraft'};}

function selAllSmall(gsm){
  getAllSmall().filter(d=>d.gsm===gsm).forEach(d=>{

function pushSmallToOrder(){
  Object.values(smallSel).forEach(({gsm,bf,size,shade,qty})=>{

function buildMsg(type,company){
  const items=getItems(type);if(!items.length)return'';
  const today=todayStr();
  let msg='';
  if(company)msg+=`*To: ${company}*\n`;
  msg+=`*Date: ${today}*\n━━━━━━━━━━━━━━━━━━━━\n`;
  if(type==='kraft'){
    const groups={};
    items.forEach(s=>{const key=`${bfLabel(s.bf)}||${s.shade}||${s.gsm}`;if(!groups[key])groups[key]={bf:bfLabel(s.bf),shade:s.shade,gsm:s.gsm,sizes:[]};groups[key].sizes.push(s);});
    Object.keys(groups).sort((a,b)=>{const ag=parseInt(a.split('||')[2]),bg=parseInt(b.split('||')[2]);return bg-ag;}).forEach(key=>{
      const g=groups[key];msg+=`\n*${g.bf} ${g.shade} shade*\n`;
      g.sizes.sort((a,b)=>a.size-b.size).forEach(s=>{msg+=`${s.size} cm x ${g.gsm} GSM - ${s.qty} Reel${s.qty!==1?'s':''}${s.note?' ('+s.note+')':''}\n`;});
    });
  } else {
    const groups={};
    items.forEach(s=>{const key=`${s.gsm}||${s.shade}`;if(!groups[key])groups[key]={gsm:s.gsm,shade:s.shade,sizes:[]};groups[key].sizes.push(s);});
    Object.keys(groups).sort((a,b)=>parseInt(b.split('||')[0])-parseInt(a.split('||')[0])).forEach(key=>{
      const g=groups[key];msg+=`\n*${g.gsm} GSM ${g.shade}*\n`;
      g.sizes.sort((a,b)=>a.size-b.size).forEach(s=>{msg+=`${s.size} cm x ${g.gsm} GSM - ${s.qty} Reel${s.qty!==1?'s':''}${s.note?' ('+s.note+')':''}\n`;});
    });
  }
  const tot=items.reduce((t,s)=>t+s.qty,0);
  msg+=`\n━━━━━━━━━━━━━━━━━━━━\n*Total: ${tot} Reel${tot!==1?'s':''} (${items.length} sizes)*`;
  return msg;
}
function updPrev(type,coId,prevId){const el=document.getElementById(prevId);if(el)el.textContent=buildMsg(type,document.getElementById(coId)?.value||'');}
// openWA and dlPDF defined below
function copyMsg(type,coId,cpId){
  const msg=buildMsg(type,document.getElementById(coId)?.value||'');
  if(!msg)return;
  const b=document.getElementById(cpId);
  if(navigator.clipboard){navigator.clipboard.writeText(msg).then(()=>{if(b){b.textContent='✓';setTimeout(()=>{b.textContent='📋 Copy';},2000);}});}
  else{const ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(b){b.textContent='✓';setTimeout(()=>{b.textContent='📋 Copy';},2000);}}
}

function updPendItem(id,idx,val){
  const orders=lsPending(),o=orders.find(x=>x.id===id);if(!o)return;
  o.items[idx].receivedQty=Math.min(parseInt(val)||0,o.items[idx].orderedQty);
  o.totalReceived=o.items.reduce((t,i)=>t+i.receivedQty,0);
  o.status=o.totalReceived===0?'PENDING':o.totalReceived>=o.totalOrdered?'RECEIVED':'PARTIALLY_RECEIVED';
  if(o.status==='RECEIVED')o.receivedDate=todayStr();
  svPending(orders);updatePendingCount();renderPending();
}
function markAllReceived(id){
  const orders=lsPending(),o=orders.find(x=>x.id===id);if(!o)return;
  o.items.forEach(i=>{i.receivedQty=i.orderedQty;});
  o.totalReceived=o.totalOrdered;o.status='RECEIVED';o.receivedDate=todayStr();
  svPending(orders);updatePendingCount();renderPending();toast('Order marked as received ✓');
}

function handleDrop(e,dir){e.preventDefault();e.target.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)processUpload(f,dir);}

async function processUpload(file,dir){
  const proc=document.getElementById(`proc-${dir}`);
  proc.innerHTML=`<div class="upload-msg msg-info">⏳ Reading ${file.name}...</div>`;
  const ext=file.name.split('.').pop().toLowerCase();
  try{
    let rows=[];
    if(ext==='pdf'){
      const ab=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:ab}).promise;
      let allLines=[];
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const content=await page.getTextContent();
        // Group text items by Y position to reconstruct rows
        const byY={};
        content.items.forEach(item=>{
          if(!item.str.trim()) return;
          const y=Math.round(item.transform[5]/2)*2;
          if(!byY[y]) byY[y]=[];
          byY[y].push({x:item.transform[4], str:item.str.trim()});
        });
        Object.keys(byY).map(Number).sort((a,b)=>b-a).forEach(y=>{
          const items=byY[y].sort((a,b)=>a.x-b.x);
          const lineText=items.map(it=>it.str).join(' ').trim();
          if(lineText) allLines.push(lineText);
        });
      }
      // Debug: log first 20 lines to console
      console.log('PDF extracted lines (first 30):');
      allLines.slice(0,30).forEach((l,i)=>console.log(`  ${i}: ${l}`));
      rows=parseInLines(allLines);
      console.log('Parsed rows:', rows.length, rows.slice(0,5));
    } else if(ext==='xlsx'||ext==='xls'||ext==='csv'){
      rows=await parseExcelFile(file);
    } else {
      proc.innerHTML=`<div class="upload-msg msg-err">⚠ Please upload a PDF or Excel (.xlsx) file.</div>`;return;
    }
    if(!rows.length){proc.innerHTML=`<div class="upload-msg msg-err">⚠ Could not read data. Check your file format.</div>`;return;}
    const agg=aggRows(rows);
    showPreview(agg,dir,file.name,rows.length);
  }catch(err){proc.innerHTML=`<div class="upload-msg msg-err">⚠ ${err.message}</div>`;console.error(err);}
}

async function parseExcelFile(file){
  if(!window.XLSX){
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
    });
  }
  const ab=await file.arrayBuffer();
  const wb=window.XLSX.read(ab,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const data=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const rows=[];
  let headerRow=-1;
  for(let i=0;i<Math.min(5,data.length);i++){
    const r=data[i].map(c=>String(c).toLowerCase());
    if(r.some(c=>c.includes('reel'))&&r.some(c=>c==='bf')&&r.some(c=>c==='gsm')){headerRow=i;break;}
  }
  if(headerRow===-1)return[];
  const hdrs=data[headerRow].map(c=>String(c).toLowerCase());
  const ci={
    reel:hdrs.findIndex(h=>h.includes('reel')),
    bf:hdrs.findIndex(h=>h==='bf'),
    gsm:hdrs.findIndex(h=>h==='gsm'),
    size:hdrs.findIndex(h=>h==='size'||h.includes('width')),
    weight:hdrs.findIndex(h=>h.includes('weight')||h==='kg'||h.includes('wt')),
    shade:hdrs.findIndex(h=>h.includes('shade')||h.includes('colour')||h.includes('color')),
  };
  for(let i=headerRow+1;i<data.length;i++){
    const row=data[i];
    if(!row||row.every(c=>!c))continue;
    const reel=String(row[ci.reel]||'').trim();
    const bf=parseInt(row[ci.bf]);
    const gsm=parseInt(row[ci.gsm]);
    const size=parseFloat(row[ci.size]);
    const weight=parseInt(row[ci.weight])||0;
    const shade=normShade(String(row[ci.shade>=0?ci.shade:0]||'Natural'));
    if(!reel||isNaN(bf)||isNaN(gsm)||isNaN(size))continue;
    if(bf<14||bf>24||gsm<90||gsm>300||size<20||size>300)continue;
    rows.push({reel,bf:String(bf),gsm:String(gsm),size,shade,kg:weight,type:'kraft',date:''});
  }
  return rows;
}

function parseInLines(lines){
  // Handles your exact PDF format:
  // - Section headers: "16+ BF 100 GSM", "18+BF 120 GSM", "22 BF 140 GSM"
  // - Data rows: "1 E-2860 16 100 50 235"
  // - Special rows: "100 E 2235 18 130 59.5 293" (reel with space)
  // - Shade sections: everything before "Golden Yellow" = Natural, after = Golden

  const rows = [];
  let currentShade = 'Natural';
  let currentBf = null;
  let currentGsm = null;

  // Pre-process: some PDF.js extractions join multiple rows on one line
  // Split any line that has multiple row patterns
  const expandedLines = [];
  lines.forEach(line => {
    const l = line.trim();
    if(!l) return;
    // If line contains multiple data rows joined together, split them
    // Pattern: digits space reel-code space bf space gsm space size space weight
    // repeated multiple times
    const multiRow = l.match(/(\d+\s+[A-Z][\w\s-]*?\d+\s+\d{2}\s+\d{2,3}\s+[\d.]+\s+\d+)/g);
    if(multiRow && multiRow.length > 1){
      // Split the multi-row line first check for headers
      const headerPart = l.match(/^(.*?)(\d+\s+[A-Z])/);
      if(headerPart && headerPart[1].trim()){
        expandedLines.push(headerPart[1].trim());
      }
      multiRow.forEach(r => expandedLines.push(r.trim()));
    } else {
      expandedLines.push(l);
    }
  });

  expandedLines.forEach(line => {
    const l = line.trim();
    if(!l) return;

    // Skip header/footer lines
    if(/^(kraft stock|s\.no|stitching wire|ms gi|ss stitch)/i.test(l)) return;

    // Golden Yellow shade marker
    if(/golden\s*yellow/i.test(l)){
      currentShade = 'Golden';
      return;
    }

    // BF + GSM section header — all formats:
    // "16+ BF 100 GSM", "18+BF 120 GSM", "22 BF 140 GSM", "20+BF 175 GSM", "18+ BF 130 GSM"
    const hdrMatch = l.match(/^(\d{2})\s*\+?\s*BF\s+(\d{2,3})\s*GSM\s*$/i);
    if(hdrMatch){
      currentBf  = hdrMatch[1];
      currentGsm = hdrMatch[2];
      return;
    }

    // Data row — matches all reel number formats:
    // "1 E-2860 16 100 50 235"
    // "100 E 2235 18 130 59.5 293"  ← reel with space inside
    // "161 F 68 22 140 50 327"      ← reel with space inside
    // "216 C-1457 16 150 50 248"
    const rowMatch = l.match(/^(\d+)\s+([A-Z][\w\s-]*?\d+)\s+(\d{2})\s+(\d{2,3})\s+([\d.]+)\s+(\d+)\s*$/i);
    if(rowMatch){
      const [, sno, reel, bf, gsm, size, weight] = rowMatch;
      const bfN=parseInt(bf), gsmN=parseInt(gsm), sizeN=parseFloat(size);
      if(bfN>=14 && bfN<=24 && gsmN>=90 && gsmN<=300 && sizeN>=10 && sizeN<=300){
        rows.push({
          reel: reel.trim(),
          bf: String(bfN),
          gsm: String(gsmN),
          size: sizeN,
          shade: currentShade,
          kg: parseInt(weight)||0,
          type: 'kraft',
          date: ''
        });
      }
      return;
    }

    // Looser match — handles lines that may have extra content
    const loosMatch = l.match(/^(\d+)\s+([A-Z][\w\s-]*?\d+)\s+(\d{2})\s+(\d{2,3})\s+([\d.]+)\s+(\d+)/i);
    if(loosMatch && !/GSM|BF|WIRE|STITCH|S\.No/i.test(l)){
      const [, sno, reel, bf, gsm, size, weight] = loosMatch;
      const bfN=parseInt(bf), gsmN=parseInt(gsm), sizeN=parseFloat(size);
      if(bfN>=14 && bfN<=24 && gsmN>=90 && gsmN<=300 && sizeN>=10 && sizeN<=300){
        rows.push({
          reel: reel.trim(),
          bf: String(bfN),
          gsm: String(gsmN),
          size: sizeN,
          shade: currentShade,
          kg: parseInt(weight)||0,
          type: 'kraft',
          date: ''
        });
      }
    }
  });

  return rows;
}

function parseOutLines(lines){
  // OUT PDF uses same format as IN
  return parseInLines(lines);
}

function parsePaper(name){
  if(!name)return null;
  const parts=name.trim().split('/').filter(p=>p.trim()!=='');
  if(parts.length===3){const[bf,gsm,size]=parts;if(isNaN(gsm)||isNaN(size))return null;return{bf:bf.trim()||null,gsm:gsm.trim(),size:parseFloat(size),type:bf.trim()?'kraft':'duplex'};}
  if(parts.length===2){const[gsm,size]=parts;if(isNaN(gsm)||isNaN(size))return null;return{bf:null,gsm:gsm.trim(),size:parseFloat(size),type:'duplex'};}
  return null;
}
function aggRows(rows){
  // Each row in your PDF = 1 individual reel
  // Group by BF+GSM+Size+Shade to get total count per spec
  const agg={};
  rows.forEach(r=>{
    const shade=r.shade||'Natural';
    const k=`${r.bf||''}/${r.gsm}/${r.size}|${shade}`;
    if(!agg[k]) agg[k]={...r,shade,count:0,totalKg:0,reels:[]};
    agg[k].count++;           // Each row = 1 reel
    agg[k].totalKg+=(parseInt(r.kg)||0);
    if(r.reel) agg[k].reels.push(r.reel);
  });
  return Object.values(agg).sort((a,b)=>parseInt(b.gsm)-parseInt(a.gsm)||parseFloat(a.size)-parseFloat(b.size));
}

function confirmUpload(uid){
  invalidateStockCache(); // Force fresh stock reads after upload
  const{agg,dir,filename,total}=window[uid];
  const stock=lsStock();
  agg.forEach(r=>{
    const key=`${r.bf||''}/${r.gsm}/${r.size}`;
    if(!stock[key])stock[key]={bf:r.bf||null,gsm:r.gsm,size:r.size,type:r.type,in_total:0,out_total:0,shades:{}};
    if(dir==='in'){stock[key].in_total=(stock[key].in_total||0)+r.count;const sh=r.shade||'Natural';stock[key].shades[sh]=(stock[key].shades[sh]||0)+r.count;}
    else stock[key].out_total=(stock[key].out_total||0)+r.count;
  });
  svStock(stock);
  // Save analytics for both IN and OUT
  const today=new Date().toISOString().slice(0,10);
  if(dir==='out'){
    const an=lsAnalytics();
    agg.forEach(r=>{
      const sz=parseFloat(r.size),t=r.bf?'kraft':'duplex',seg=t==='duplex'?'duplex':SMALL_SIZES.includes(sz)?'small':'kraft';
      an.push({date:today,filename,spec:r.bf?`BF${r.bf}/${r.gsm}GSM/${r.size}cm`:`${r.gsm}GSM/${r.size}cm`,bf:r.bf||null,gsm:r.gsm,size:r.size,shade:r.shade||'—',count:r.count,kg:r.totalKg||0,type:t,segment:seg});
    });
    svAnalytics(an);
  }
  if(dir==='in'){
    const ian=lsInAnalytics();
    agg.forEach(r=>{
      const sz=parseFloat(r.size),t=r.bf?'kraft':'duplex',seg=t==='duplex'?'duplex':SMALL_SIZES.includes(sz)?'small':'kraft';
      ian.push({date:today,filename,spec:r.bf?`BF${r.bf}/${r.gsm}GSM/${r.size}cm`:`${r.gsm}GSM/${r.size}cm`,bf:r.bf||null,gsm:r.gsm,size:r.size,shade:r.shade||'—',count:r.count,kg:r.totalKg||0,type:t,segment:seg});
    });
    svInAnalytics(ian);
  }
  const hist=lsHist();hist.unshift({id:Date.now(),dir,filename,date:todayStr(),reels:total,specs:agg.length,rows:agg.slice(0,60)});svHist(hist);
  delete window[uid];
  const proc=document.getElementById(`proc-${dir}`);
  if(proc)proc.innerHTML=`<div class="upload-msg msg-ok">✓ Saved! ${total} reels ${dir==='in'?'added to':'deducted from'} stock.</div>`;
  toast(`${total} reels ${dir==='in'?'added to stock':'deducted from stock'} ✓`);
  renderUploadHistory();
  setTimeout(()=>{if(proc)proc.innerHTML='';},5000);
}

function anRenderTable(outData,inData,period,view){
  const pm={};
  if(view==='both'||view==='out'){
    outData.forEach(d=>{const pk=getPK(d.date,period);if(!pm[pk])pm[pk]={label:fmtPK(pk,period),outTotal:0,inTotal:0,outKraft:0,outSmall:0,outDuplex:0,inKraft:0,inSmall:0,inDuplex:0};pm[pk].outTotal+=d.count;if(d.segment==='kraft')pm[pk].outKraft+=d.count;else if(d.segment==='small')pm[pk].outSmall+=d.count;else pm[pk].outDuplex+=d.count;});
  }
  if(view==='both'||view==='in'){
    inData.forEach(d=>{const pk=getPK(d.date,period);if(!pm[pk])pm[pk]={label:fmtPK(pk,period),outTotal:0,inTotal:0,outKraft:0,outSmall:0,outDuplex:0,inKraft:0,inSmall:0,inDuplex:0};pm[pk].inTotal+=d.count;if(d.segment==='kraft')pm[pk].inKraft+=d.count;else if(d.segment==='small')pm[pk].inSmall+=d.count;else pm[pk].inDuplex+=d.count;});
  }
  const periods=Object.entries(pm).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!periods.length)return'';
  const maxOut=Math.max(...periods.map(([,v])=>v.outTotal),1);
  const maxIn=Math.max(...periods.map(([,v])=>v.inTotal),1);
  const pLabel=period==='daily'?'Date':period==='weekly'?'Week':'Month';
  let h=`<div class="card" style="margin-bottom:12px">
    <div class="card-title">${pLabel}-wise Summary</div>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>${pLabel}</th>
      ${(view==='both'||view==='out')?'<th style="text-align:right;color:var(--blue)">📤 OUT</th><th style="text-align:right;font-size:9px;color:var(--text3)">K</th><th style="text-align:right;font-size:9px;color:var(--text3)">Sm</th><th style="text-align:right;font-size:9px;color:var(--text3)">D</th>':''}
      ${(view==='both'||view==='in')?'<th style="text-align:right;color:var(--green)">📥 IN</th><th style="text-align:right;font-size:9px;color:var(--text3)">K</th><th style="text-align:right;font-size:9px;color:var(--text3)">Sm</th><th style="text-align:right;font-size:9px;color:var(--text3)">D</th>':''}
      ${view==='both'?'<th style="text-align:right;font-size:9px;color:var(--text3)">Net</th>':''}
      <th>Trend</th>
    </tr></thead><tbody>`;
  periods.forEach(([pk,v])=>{
    const net=v.inTotal-v.outTotal;
    const nc=net>=0?'var(--green)':'var(--red)';
    const obw=maxOut>0?Math.round(v.outTotal/maxOut*80):0;
    const ibw=maxIn>0?Math.round(v.inTotal/maxIn*80):0;
    h+=`<tr>
      <td style="font-weight:600;font-size:12px;white-space:nowrap">${v.label}</td>
      ${(view==='both'||view==='out')?`<td style="text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--blue)">${v.outTotal}</td><td style="text-align:right;font-size:11px;color:var(--text3)">${v.outKraft}</td><td style="text-align:right;font-size:11px;color:var(--text3)">${v.outSmall}</td><td style="text-align:right;font-size:11px;color:var(--text3)">${v.outDuplex}</td>`:''}
      ${(view==='both'||view==='in')?`<td style="text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--green)">${v.inTotal}</td><td style="text-align:right;font-size:11px;color:var(--text3)">${v.inKraft}</td><td style="text-align:right;font-size:11px;color:var(--text3)">${v.inSmall}</td><td style="text-align:right;font-size:11px;color:var(--text3)">${v.inDuplex}</td>`:''}
      ${view==='both'?`<td style="text-align:right;font-family:var(--font-mono);font-weight:700;font-size:12px;color:${nc}">${net>=0?'+':''}${net}</td>`:''}
      <td><div style="display:flex;flex-direction:column;gap:2px">
        ${(view==='both'||view==='out')&&v.outTotal?`<div style="height:5px;width:${obw}px;background:var(--blue);border-radius:3px;min-width:2px"></div>`:''}
        ${(view==='both'||view==='in')&&v.inTotal?`<div style="height:5px;width:${ibw}px;background:var(--green);border-radius:3px;min-width:2px"></div>`:''}
      </div></td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}

function anTopSizes(data,dir){
  if(!data.length)return'';
  const sm={};data.forEach(d=>{if(!sm[d.spec])sm[d.spec]={spec:d.spec,seg:d.segment,total:0};sm[d.spec].total+=d.count;});
  const top=Object.values(sm).sort((a,b)=>b.total-a.total).slice(0,10);
  if(!top.length)return'';
  const mx=top[0].total;
  const col=dir==='out'?'var(--blue)':'var(--green)';
  const icon=dir==='out'?'📤':'📥';
  return `<div class="card" style="margin-bottom:12px">
    <div class="card-title">${icon} Top Sizes ${dir==='out'?'(Most Sold)':'(Most Received)'}</div>
    ${top.map(s=>`<div class="an-row">
      <div class="an-label mono" style="font-size:11px;flex:1">${s.spec}</div>
      ${segPill(s.seg)}
      <div style="min-width:36px;text-align:right;font-family:var(--font-mono);font-weight:700;color:${col}">${s.total}</div>
      <div class="an-bar"><div style="height:6px;width:${Math.round(s.total/mx*100)}px;background:${col};border-radius:3px;min-width:2px"></div></div>
    </div>`).join('')}
  </div>`;
}

function getPK(d,p){if(!d)return'Unknown';if(p==='daily')return d;if(p==='monthly')return d.slice(0,7);if(p==='weekly'){const dt=new Date(d),day=dt.getDay()||7;dt.setDate(dt.getDate()-day+1);return dt.toISOString().slice(0,10);}return d;}
function fmtPK(k,p){if(!k||k==='Unknown')return'Unknown';if(p==='monthly'){const[y,m]=k.split('-');return['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+' '+y;}if(p==='weekly'){const d=new Date(k),e=new Date(k);e.setDate(e.getDate()+6);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' – '+e.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});}const d=new Date(k);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});}

function buildPDFHtml(type, company, items){
  if(!items.length) return null;
  const today = todayStr();

  // Group by BF+Shade (kraft) or GSM+Shade (duplex)
  const groups = {};
  items.forEach(s=>{
    const key = type==='kraft'
      ? `${bfLabel(s.bf||'18')}||${s.shade}||${s.gsm}`
      : `${s.gsm}||${s.shade||''}`;
    const label = type==='kraft'
      ? `${bfLabel(s.bf||'18')} &mdash; ${s.shade} Shade`
      : `${s.gsm} GSM &mdash; ${s.shade||''}`;
    if(!groups[key]) groups[key]={label, items:[]};
    groups[key].items.push(s);
  });

  let tableRows='', num=1;
  Object.keys(groups)
    .sort((a,b)=>{
      const ak=parseInt(a.split('||')[2]||a.split('||')[0]);
      const bk=parseInt(b.split('||')[2]||b.split('||')[0]);
      return bk-ak;
    })
    .forEach(key=>{
      const g=groups[key];
      tableRows+=`<tr class="grp"><td colspan="4">${g.label}</td></tr>`;
      g.items.sort((a,b)=>a.size-b.size).forEach(s=>{
        const qty=s.qty||s.orderedQty||0;
        tableRows+=`<tr>
          <td class="num">${num++}</td>
          <td class="spec">${s.size} cm &times; ${s.gsm} GSM</td>
          <td class="shade">${s.shade||'&mdash;'}${s.note?` <span class="note">(${s.note})</span>`:''}</td>
          <td class="qty">${qty} Reel${qty!==1?'s':''}</td>
        </tr>`;
      });
    });

  const tot = items.reduce((t,s)=>t+(s.qty||s.orderedQty||0),0);
  const typeLabel = type==='kraft' ? 'KRAFT PAPER ORDER' : 'DUPLEX BOARD ORDER';
  const badgeBg   = type==='kraft' ? '#fef3c7' : '#dbeafe';
  const badgeCol  = type==='kraft' ? '#92400e' : '#1e40af';

  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#1a1a18;padding:32px 40px;max-width:720px;margin:0 auto}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:2.5px solid #1a1a18;margin-bottom:18px}

// Generates PDF blob URL and returns it
function generatePDFBlob(type, company, items){
  const html = buildPDFHtml(type, company, items);
  if(!html) return null;
  return new Blob([html], {type:'text/html'});
}

// Download PDF directly
function dlPDF(type, coId){
  const co  = document.getElementById(coId)?.value||'';
  const its = getItems(type);
  if(!its.length){ toast('No items to export'); return; }
  const blob = generatePDFBlob(type, co, its);
  const url  = URL.createObjectURL(blob);
  const fname= `Order_${type==='kraft'?'Kraft':'Duplex'}_${(co||'order').replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.html`;
  const a    = document.createElement('a');
  a.href=url; a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
  toast('📄 PDF downloaded — open it and print / share');
}

  invalidateStockCache();
  toast('✓ Everything reset! Fresh start.');

// ── SEARCH STOCK ──────────────────────────────────────────────────────────────
function renderSearch(){
  const wrap=document.getElementById('page-search');
  if(!wrap)return;
  const q=(wrap.querySelector('#srch-q')?.value||'').toLowerCase();
  const typeF=wrap.querySelector('#srch-type')?.value||'';
  const gsmF=wrap.querySelector('#srch-gsm')?.value||'';
  const bfF=wrap.querySelector('#srch-bf')?.value||'';
  const shadeF=wrap.querySelector('#srch-shade')?.value||'';

  const stockDb=lsStock();
  const all=[];

  Object.entries(stockDb).forEach(([key,e])=>{
    const stock=Math.max(0,(e.in_total||0)-(e.out_total||0));
    if(stock<=0) return;
    const bf=e.bf||null;
    const gsm=String(e.gsm||'');
    const size=parseFloat(e.size||0);
    const type=bf?'kraft':'duplex';
    const shades=e.shades&&Object.keys(e.shades).length>0?e.shades:{Natural:stock};
    Object.entries(shades).forEach(([shade,cnt])=>{
      if(cnt<=0) return;
      const spec=bf?`BF${bf} / ${gsm}GSM / ${size}cm`:`${gsm}GSM / ${size}cm`;
      all.push({type,bf,gsm,size,shade,stock,spec});
    });
  });

  const uniqueGsms=[...new Set(all.map(r=>r.gsm))].sort((a,b)=>parseInt(b)-parseInt(a));
  const uniqueBfs=[...new Set(all.filter(r=>r.bf).map(r=>r.bf))].sort((a,b)=>parseInt(a)-parseInt(b));
  const uniqueShades=[...new Set(all.map(r=>r.shade))].sort();

  const results=all.filter(r=>{
    if(q){
      const s=r.spec.toLowerCase(),sh=r.shade.toLowerCase();
      if(!s.includes(q)&&!sh.includes(q)) return false;
    }
    if(typeF&&r.type!==typeF) return false;
    if(gsmF&&r.gsm!==gsmF) return false;
    if(bfF&&String(r.bf)!==bfF) return false;
    if(shadeF&&r.shade!==shadeF) return false;
    return true;
  }).sort((a,b)=>parseInt(b.gsm)-parseInt(a.gsm)||a.size-b.size);

  // Build HTML
  let html='';
  html+=`<div class="section-hdr"><div class="section-title">🔍 Search Stock</div>`;
  html+=`<span class="section-sub">${results.length} specs in stock</span></div>`;
  html+=`<div class="card" style="margin-bottom:12px">`;
  html+=`<input class="fi" id="srch-q" placeholder="Search by size, GSM, BF, shade..." oninput="renderSearch()" value="${q}" style="margin-bottom:8px;font-size:14px;width:100%">`;
  html+=`<div class="filter-bar">`;
  html+=`<select class="fsel" id="srch-type" onchange="renderSearch()"><option value=""${!typeF?' selected':''}>All Types</option><option value="kraft"${typeF==='kraft'?' selected':''}>Kraft</option><option value="duplex"${typeF==='duplex'?' selected':''}>Duplex</option></select>`;
  html+=`<select class="fsel" id="srch-gsm" onchange="renderSearch()"><option value=""${!gsmF?' selected':''}>All GSM</option>${uniqueGsms.map(g=>`<option value="${g}"${gsmF===g?' selected':''}>${g} GSM</option>`).join('')}</select>`;
  html+=`<select class="fsel" id="srch-bf" onchange="renderSearch()"><option value=""${!bfF?' selected':''}>All BF</option>${uniqueBfs.map(b=>`<option value="${b}"${bfF===b?' selected':''}>${b}+BF</option>`).join('')}</select>`;
  html+=`<select class="fsel" id="srch-shade" onchange="renderSearch()"><option value=""${!shadeF?' selected':''}>All Shades</option>${uniqueShades.map(s=>`<option value="${s}"${shadeF===s?' selected':''}>${s}</option>`).join('')}</select>`;
  html+=`</div></div>`;

  if(!all.length){
    html+=`<div class="empty"><span class="empty-icon">🔍</span><b>No stock found.</b><br>Upload your PDF from the ⬆️ Upload tab first.</div>`;
  } else if(!results.length){
    html+=`<div class="empty"><span class="empty-icon">🔍</span>No results. Try different filters.</div>`;
  } else {
    html+=`<div class="table-wrap"><table><thead><tr><th>Spec</th><th>Type</th><th>Shade</th><th style="text-align:center">Stock</th><th style="text-align:center">Held</th><th style="text-align:center">Available</th><th>Hold</th></tr></thead><tbody>`;
    results.forEach(r=>{
      const holdKey=r.bf?`kraft|${r.gsm}|${r.bf}|${r.size}|${r.shade.replace(/\s+/g,'_')}`:`duplex|${r.gsm}|D|${r.size}|${r.shade.replace(/\s+/g,'_')}`;
      const holds=lsHolds().filter(h=>h.key===holdKey&&h.status==='active');
      const heldQty=holds.reduce((t,h)=>t+h.qty,0);
      const avail=Math.max(0,r.stock-heldQty);
      const stockColor=r.stock<3?'var(--amber)':'var(--green)';
      html+=`<tr>`;
      html+=`<td class="mono" style="font-size:11px;font-weight:600">${r.spec}</td>`;
      html+=`<td>${typePill(r.type)}</td>`;
      html+=`<td>${shdPill(r.shade)}</td>`;
      html+=`<td style="text-align:center"><span style="font-family:var(--font-mono);font-weight:700;font-size:14px;color:${stockColor}">${r.stock}</span></td>`;
      html+=`<td style="text-align:center;color:var(--red);font-family:var(--font-mono);font-weight:600">${heldQty||'—'}</td>`;
      html+=`<td style="text-align:center;font-family:var(--font-mono);font-weight:700;color:var(--green)">${avail}</td>`;
      html+=`<td><button onclick="quickHold('${holdKey}','${r.spec}',${avail})" class="btn btn-sm" style="font-size:10px;padding:4px 8px">🔒 Hold</button></td>`;
      html+=`</tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  wrap.innerHTML=html;
}




// ── HOLD STOCK ────────────────────────────────────────────────────────────────
const HOLD_KEY='godown_holds_v1';
function lsHolds(){try{return JSON.parse(localStorage.getItem(HOLD_KEY)||'[]')}catch(e){return[]}}
function svHolds(d){try{localStorage.setItem(HOLD_KEY,JSON.stringify(d));}catch(e){}fsSave(HOLD_KEY,d);}

function quickHold(key,spec,avail){
  openModal(`
    <div class="modal-title">🔒 Hold Stock</div>
    <div style="font-size:13px;font-weight:600;margin-bottom:4px;font-family:var(--font-mono)">${spec}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">Available: <b style="color:var(--text)">${avail} reels</b></div>
    <div class="fg" style="margin-bottom:10px">
      <div class="fl">Customer Name</div>
      <input class="fi" id="hold-customer" placeholder="e.g. Sharma Ji, ABC Packaging...">
    </div>
    <div class="fg" style="margin-bottom:10px">
      <div class="fl">Quantity (Reels)</div>
      <input class="fi" type="number" id="hold-qty" min="1" max="${avail}" value="1" style="font-size:18px;font-weight:700;font-family:var(--font-mono)">
    </div>
    <div class="fg" style="margin-bottom:14px">
      <div class="fl">Note (optional)</div>
      <input class="fi" id="hold-note" placeholder="e.g. Delivery by Friday, price confirmed...">
    </div>
    <div class="btn-row">
      <button class="btn btn-g" onclick="saveHold('${key}','${spec}')">🔒 Confirm Hold</button>
      <button class="btn" onclick="closeModal({target:document.getElementById('modal-overlay')})">Cancel</button>
    </div>`);
  setTimeout(()=>document.getElementById('hold-customer')?.focus(),100);
}

function saveHold(key,spec){
  const customer=document.getElementById('hold-customer')?.value.trim();
  const qty=parseInt(document.getElementById('hold-qty')?.value)||0;
  const note=document.getElementById('hold-note')?.value.trim()||'';
  if(!customer){toast('Enter customer name');return;}
  if(!qty||qty<1){toast('Enter valid quantity');return;}
  const holds=lsHolds();
  holds.unshift({id:Date.now(),key,spec,customer,qty,note,date:todayStr(),ts:new Date().toISOString(),status:'active',createdBy:currentUser?.name||'Admin'});
  svHolds(holds);
  closeModal({target:document.getElementById('modal-overlay')});
  toast(`🔒 ${qty} reels held for ${customer}`);
  renderSearch();
}

function renderHold(){
  const wrap=document.getElementById('page-hold');
  if(!wrap)return;
  const holds=lsHolds();
  const active=holds.filter(h=>h.status==='active');
  const released=holds.filter(h=>h.status==='released');
  const totalHeld=active.reduce((t,h)=>t+h.qty,0);
  wrap.innerHTML=`
    <div class="section-hdr"><div class="section-title">🔒 Hold Stock</div></div>
    <div class="metric-row" style="margin-bottom:14px">
      <div class="metric-card"><div class="metric-label">Active Holds</div><div class="metric-val r">${active.length}</div><div class="metric-sub">${totalHeld} reels held</div></div>
      <div class="metric-card"><div class="metric-label">Released</div><div class="metric-val g">${released.length}</div><div class="metric-sub">completed</div></div>
      <div class="metric-card" style="cursor:pointer" onclick="navigateTo('search')">
        <div class="metric-label">Add New Hold</div><div class="metric-val" style="font-size:24px">🔍</div><div class="metric-sub">Search → Hold</div>
      </div>
    </div>
    ${active.length?`<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;font-family:var(--font-mono)">Active Holds</div>${active.map(h=>holdCard(h)).join('')}`:''}
    ${released.length?`<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;font-family:var(--font-mono)">Released</div>${released.slice(0,10).map(h=>holdCard(h)).join('')}`:''}
    ${!holds.length?`<div class="empty"><span class="empty-icon">🔒</span>No holds yet.<br>Go to <b>🔍 Search Stock</b> → find a spec → click <b>Hold</b>.</div>`:''}`;
}

function holdCard(h){
  const isActive=h.status==='active';
  return`<div class="card" style="border-left:4px solid ${isActive?'var(--red)':'var(--green)'};margin-bottom:8px;padding:12px 14px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;${isActive?'background:var(--red-d);color:var(--red)':'background:var(--green-d);color:var(--green)'}">
        ${isActive?'🔒 ACTIVE':'✓ RELEASED'}</span>
      <span style="font-size:13px;font-weight:700">${h.customer}</span>
      <span style="font-size:11px;color:var(--text3);margin-left:auto">${h.date}</span>
    </div>
    <div style="font-family:var(--font-mono);font-size:12px;font-weight:600;margin-bottom:6px">${h.spec}</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:${isActive?'10':'0'}px">
      <span style="font-size:22px;font-weight:700;font-family:var(--font-mono);color:var(--red)">${h.qty} reels</span>
      ${h.note?`<span style="font-size:11px;color:var(--text3);font-style:italic">• ${h.note}</span>`:''}
    </div>
    ${isActive?`<div class="btn-row">
      <button class="btn btn-g btn-sm" onclick="releaseHold(${h.id})">✓ Release Hold</button>
      <button class="btn btn-sm btn-red" onclick="deleteHold(${h.id})">🗑 Delete</button>
    </div>`:''}
  </div>`;
}

function releaseHold(id){
  const holds=lsHolds(),h=holds.find(x=>x.id===id);
  if(!h)return;
  h.status='released';h.releasedDate=todayStr();
  svHolds(holds);toast('Hold released ✓');renderHold();
}
function deleteHold(id){
  if(!confirm('Delete this hold?'))return;
  svHolds(lsHolds().filter(h=>h.id!==id));
  toast('Hold deleted');renderHold();
}


function setupRealtimeSync(){
  if(!window.fbDb) return;
  const watchDocs=[
    {path:'godown/stock',key:SK},
    {path:'godown/history',key:HK},
    {path:'godown/pending',key:PK},
    {path:'godown/analytics_out',key:AK},
    {path:'godown/analytics_in',key:IAK},
    {path:'godown/holds',key:HOLD_KEY},
  ];
  watchDocs.forEach(({path,key})=>{
    const [col,docId]=path.split('/');
    window.fbDb.collection(col).doc(docId).onSnapshot(snap=>{
      if(snap.exists){
        const data=snap.data().value;
        try{localStorage.setItem(key,typeof data==='string'?data:JSON.stringify(data));}catch(e){}
        invalidateStockCache();
        if(key===SK){
          if(currentPage==='dashboard')renderDashboard();
          if(currentPage==='stock')renderStock();
          if(currentPage==='search')renderSearch();
          if(currentPage==='alerts')renderAlerts();
        }
        if(key===PK&&currentPage==='pending')renderPending();
        if((key===AK||key===IAK)&&currentPage==='analytics')renderAnalytics();
        if(key===HK&&currentPage==='upload')renderUploadHistory();
        if(key===HOLD_KEY&&currentPage==='hold')renderHold();
      }
    },err=>console.warn('Sync error:',err.message));
  });
  console.log('✅ Real-time sync active');
}


function adminClearStock(){
  const pwd=prompt('Enter admin password to clear all stock:');
  if(pwd===null)return;
  if(pwd!=='RAMRAMJI214'){toast('❌ Wrong password. Stock not cleared.');return;}
  if(!confirm('Clear ALL stock data on all devices? Cannot be undone.'))return;
  localStorage.removeItem(SK);
  if(window.fbDb){
    window.fbDb.collection('godown').doc('stock').set({value:'{}',updatedBy:currentUser?.name||'admin'}).catch(e=>console.warn(e));
  }
  invalidateStockCache();
  toast('✓ Stock cleared!');
  setTimeout(()=>{
    renderDashboard();
    if(currentPage==='stock')renderStock();
    if(currentPage==='search')renderSearch();
  },300);
}
